<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro TV - Disculpa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="tv-mueble">
        <div class="antena izq"></div>
        <div class="antena der"></div>

        <div class="tv-frontal">
            <div class="crt-pantalla" id="pantalla">
                <div class="tv-static" id="tvStatic"></div>
                <div class="vhs-glitch" id="vhsGlitch"></div>
                <div class="screen-glare"></div>
                
                <span id="screenText">TV APAGADA</span>
                <div id="tvSignalAnimation" class="signal-on"></div>
            </div>

            <div class="tv-controles">
                <div class="perilla"></div>
                <div class="perilla"></div>
                <div class="bocina-ranuras"></div>
                <div class="bocina-ranuras"></div>
                
                <div class="tv-power-btn" id="powerBtn">
                    <div class="tv-led" id="tvLed"></div>
                </div>
                <span class="power-label">POWER</span>
            </div>
        </div>
    </div>

    <div class="indicador-arrastre" id="indicador" style="display: none;">
        <span>▲ ARRASTRA EL DISQUETE ▲</span>
    </div>

    <div class="disquetera-unidad" id="dropZone">
        <div class="disquetera-capa-fondo"></div>
        
        <div class="disquete" id="floppyDisk">
            <div class="disquete-label">DISCULPA</div>
            <div class="disquete-metal"></div>
        </div>

        <div class="disquetera-capa-frente"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
